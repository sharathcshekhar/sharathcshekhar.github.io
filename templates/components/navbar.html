<header id="site-header" class="site-header">
  <div class="header-inner container">
    <a href="{{ page.root }}index.html" class="brand">
      <div class="brand-avatar-mini">
        <img src="{{ page.root }}{{ site.avatar }}" alt="{{ site.author }}" width="36" height="36">
      </div>
      <span class="brand-name">{{ site.author }}</span>
    </a>

    <nav id="site-nav" class="site-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        {% for item in site.nav %}
          {% if item.dropdown %}
            <li class="nav-item has-dropdown">
              <button class="nav-link dropdown-toggle" aria-expanded="false" aria-haspopup="true">
                {{ item.title }}
                <svg class="icon-chevron" viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
                  <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
              </button>
              <ul class="dropdown-menu">
                {% for sub in item.dropdown %}
                  <li>
                    <a href="{{ page.root }}{{ sub.url }}" class="dropdown-item {% if page.id == sub.id %}active{% endif %}">
                      {{ sub.title }}
                    </a>
                  </li>
                {% endfor %}
              </ul>
            </li>
          {% else %}
            <li class="nav-item">
              <a href="{{ page.root }}{{ item.url }}" class="nav-link {% if page.id == item.id %}active{% endif %}">
                {{ item.title }}
              </a>
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <!-- Theme Switcher -->
      <button id="theme-toggle" class="btn-icon theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Mobile Hamburger Menu Button -->
      <button id="mobile-menu-toggle" class="btn-icon mobile-menu-toggle" aria-label="Toggle navigation menu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>
  </div>
</header>
