<div class="home-layout">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-card">
      <div class="hero-avatar-wrapper">
        <img src="{{ page.avatar | default: site.avatar }}" alt="{{ site.author }}" class="hero-avatar" width="140" height="140">
        <div class="avatar-ring"></div>
      </div>
      <div class="hero-info">
        <div class="hero-badge-pill">
          <span class="pulse-dot"></span>
          <span>{{ page.badge_pill | default: site.role }}</span>
        </div>
        <h1 class="hero-title">{{ page.heading | default: site.author }}</h1>
        <p class="hero-tagline">{{ page.tagline | default: site.tagline }}</p>
      </div>
    </div>
  </section>

  <!-- Two-Column Grid: Bio & News -->
  <div class="home-grid">
    <!-- Biography & Highlights -->
    <section class="home-main-col">
      <div class="content-card bio-card">
        <div class="markdown-body">
          {{ page.body_html | safe }}
        </div>
      </div>
    </section>

    <!-- News & Updates Feed -->
    <aside class="home-side-col">
      <div class="content-card news-card">
        <div class="card-header">
          <h2 class="card-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
            </svg>
            <span>News & Highlights</span>
          </h2>
        </div>
        
        <ul class="news-list">
          {% for item in page.news %}
            <li class="news-item">
              <span class="news-date">{{ item.date }}</span>
              <p class="news-text">{{ item.text }}</p>
            </li>
          {% endfor %}
        </ul>
      </div>
    </aside>
  </div>
</div>
